name: Build Mac DMG

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'cheating-daddy/package-lock.json'
    
    - name: Setup signing certificate
      env:
        CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      run: |
        # Create keychain
        security create-keychain -p actions build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p actions build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        
        # Import certificate
        echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
        security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
        
        # Clean up
        rm certificate.p12
        
    - name: Install dependencies
      working-directory: ./cheating-daddy
      run: npm ci
      
    - name: Build DMG for Mac (Apple Silicon)
      working-directory: ./cheating-daddy
      timeout-minutes: 90
      run: npm run make -- --platform=darwin --arch=arm64
      env:
        CI: true
        DEBUG: electron-notarize*
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    
    - name: Verify Notarization Completed
      if: always()
      run: |
        echo "📋 Checking recent notarization submissions..."
        xcrun notarytool history \
          --apple-id "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APPLE_ID_PASSWORD }}" \
          --team-id "${{ secrets.APPLE_TEAM_ID }}" \
          | head -20
      
    - name: Build DMG for Mac (Intel)
      working-directory: ./cheating-daddy
      timeout-minutes: 90
      run: npm run make -- --platform=darwin --arch=x64
      env:
        CI: true
        DEBUG: electron-notarize*
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      
    - name: List build outputs
      working-directory: ./cheating-daddy
      run: |
        echo "Build outputs:"
        ls -la out/make/
        find out/make/ -name "*.dmg"
      
    - name: Upload DMG (Apple Silicon)
      uses: actions/upload-artifact@v4
      with:
        name: cheating-daddy-mac-arm64
        path: cheating-daddy/out/make/**/*arm64*.dmg
        if-no-files-found: warn
        
    - name: Upload DMG (Intel)
      uses: actions/upload-artifact@v4
      with:
        name: cheating-daddy-mac-x64
        path: cheating-daddy/out/make/**/*x64*.dmg
        if-no-files-found: warn
        
    - name: Upload to Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: cheating-daddy/out/make/**/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
